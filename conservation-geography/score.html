<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Score - Conservation Geography</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3a0ca3, black);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 1s ease-out;
    }

    .result-container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 2;
      animation: scaleIn 0.6s ease-in-out;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      animation: slideUp 0.7s ease-out;
    }

    .result {
      font-size: 1.5rem;
      margin-bottom: 20px;
      animation: fadeInUp 1.2s ease-out;
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      color: #00ffcc;
      animation: pulse 1.5s infinite;
    }

    /* Animation Definitions */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }

    .back-link {
      display: block;
      margin-top: 30px;
      font-size: 1rem;
      color: #e0aaff;
      text-decoration: none;
      animation: fadeInUp 1.2s ease-out;
    }

    .back-link:hover {
      color: #f15bb5;
    }

    .navigation-btns {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 20px;
      animation: fadeInUp 2s ease-in-out;
    }

    .navigation-btns button {
      padding: 10px 20px;
      background: linear-gradient(45deg, #7209b7, #560bad);
      color: white;
      border: none;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .navigation-btns button:hover {
      background: #9d4edd;
      transform: scale(1.05);
    }

    .logo {
      font-size: 3rem;
      font-weight: 700;
      color: #c77dff;
      margin-bottom: 50px;
      margin-left: 50px;
    }

    #tsparticles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0; /* Behind everything */
      top: 0;
      left: 0;
    }

    .score-container {
      background: rgba(255,255,255,0.1);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
      max-width: 400px;
      margin: 30px auto;
    }
    .score-title {
      font-size: 2.2rem;
      color: #e0aaff;
      margin-bottom: 20px;
    }
    .score-value {
      font-size: 2.5rem;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .shuffle-info {
      font-size: 1.1rem;
      color: #f3c4fb;
      margin-bottom: 20px;
    }
    .btn {
      padding: 0.9em 2em;
      background: linear-gradient(45deg, #7209b7, #560bad);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 10px 0;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background: #a259ff;
    }
    .next-week-btn {
      background: linear-gradient(45deg, #7209b7, #560bad);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 2px 8px #7209b733;
    }
    .next-week-btn:hover {
      background: #9d4edd;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      body, html {
        padding: 0;
        margin: 0;
        min-height: 100vh;
        width: 100vw;
        overflow-x: hidden;
      }
      .logo {
        font-size: 1.5rem;
        margin-bottom: 10px;
        margin-left: 0;
        text-align: center;
      }
      .result-container {
        padding: 10px 2vw;
        border-radius: 10px;
        width: 96vw;
        max-width: 100vw;
        margin: 0 auto;
        box-sizing: border-box;
      }
      h1, .score-title, .score-value, .shuffle-info, .motivation, .total-questions {
        font-size: 1.1rem !important;
        margin-bottom: 10px;
        margin-top: 0;
      }
      .score {
        font-size: 1.1rem;
        margin-top: 10px;
      }
      .navigation-btns {
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .navigation-btns button, .next-week-btn, .btn {
        font-size: 1rem;
        padding: 10px 0;
        width: 100%;
        margin: 4px 0;
      }
    }
  </style>
</head>
<body>
  <div class="logo">QuizingSphere</div>

  <div class="result-container">
    <h1>Quiz Results</h1>
    <div class="score" id="score-value"></div>
    <div class="shuffle-info" id="shuffle-info"></div>
    <div class="motivation" id="motivation-message" style="margin:20px 0 30px 0;font-size:1.2rem;"></div>
    <div class="total-questions" id="total-questions-info" style="margin-bottom:20px;font-size:1.1rem;"></div>
    <div class="navigation-btns">
      <button onclick="window.location.href='index.html'">Go to Homepage</button>
      <button onclick="window.location.href='practice.html'">Go to Week selection</button>
    </div>
    <div style="margin-top:20px;">
      <button id="next-week-btn" class="next-week-btn" style="display:none;min-width:200px;font-size:1.1rem;">Go to Next Week</button>
    </div>
  </div>

  <!-- Particle Background -->
  <div id="tsparticles"></div>

  <script src="questions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <script>
    // Initialize particles background
    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      background: { color: "transparent" },
      particles: {
        number: { value: 60, density: { enable: true, area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        move: { enable: true, speed: 1, direction: "none", outModes: "bounce" },
        links: { enable: true, distance: 100, color: "#ffffff", opacity: 0.2, width: 1 }
      },
      interactivity: {
        events: {
          onHover: { enable: true, mode: "repulse" },
          onClick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { quantity: 4 }
        }
      }
    });

    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    const score = getParam('score');
    let total = getParam('total');
    if (!total) total = getParam('totalQuestions');
    const week = getParam('week');
    const randomizeQuestions = getParam('randomizeQuestions') === 'yes';
    const randomizeAnswers = getParam('randomizeAnswers') === 'yes';
    // Show score and total
    if (score !== null && total !== null) {
      document.getElementById('score-value').textContent = `Score: ${score} / ${total}`;
      document.getElementById('total-questions-info').textContent = `Total Questions: ${total}`;
      document.getElementById('shuffle-info').textContent = `Question Order: ${randomizeQuestions ? 'Shuffled' : 'Original'} | Answer Order: ${randomizeAnswers ? 'Shuffled' : 'Original'}`;
      // Motivational message
      let message = '';
      if (score == total && total > 0) {
        message = "Outstanding! You got a perfect score! 🌟";
      } else if (score >= total * 0.8) {
        message = "Great job! You're almost there! 💪";
      } else if (score >= total * 0.5) {
        message = "Good effort! Keep practicing and you'll master it! 🚀";
      } else if (score > 0) {
        message = "Don't give up! Review and try again – you can do it! 🙌";
      } else {
        message = "Keep rocking and never stop learning! 🎉";
      }
      document.getElementById('motivation-message').textContent = message;
    } else {
      document.getElementById('score-value').textContent = 'Quiz not found or incomplete.';
      document.getElementById('motivation-message').textContent = 'Try a quiz from the week selection!';
      document.getElementById('shuffle-info').textContent = '';
      document.getElementById('total-questions-info').textContent = '';
    }
    // Next week logic
    if (week) {
      const match = week.match(/week(\d+)/);
      if (match) {
        const currentNum = parseInt(match[1]);
        let nextWeek = null;
        for (let i = currentNum + 1; i <= 12; i++) {
          if (typeof allQuestions !== 'undefined' && allQuestions['week' + i] && allQuestions['week' + i].length > 0) {
            nextWeek = 'week' + i;
            break;
          }
        }
        if (nextWeek) {
          document.getElementById('next-week-btn').style.display = '';
          document.getElementById('next-week-btn').onclick = function() {
            const url = `quiz.html?week=${nextWeek}&randomizeQuestions=${randomizeQuestions ? 'yes' : 'no'}&randomizeAnswers=${randomizeAnswers ? 'yes' : 'no'}`;
            window.location.href = url;
          };
        }
      }
    }
  </script>

</body>
</html>
