<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Additional Questions | Conservation Geography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3a0ca3, #0f0f0f);
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 2em auto;
      background: rgba(80, 40, 180, 0.18);
      border-radius: 24px;
      box-shadow: 0 4px 32px #3a0ca355;
      padding: 2.5em 2em;
      position: relative;
    }
    .back-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      background: linear-gradient(45deg, #7209b7, #560bad);
      color: #fff;
      border: none;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.6em 1.7em;
      cursor: pointer;
      box-shadow: 0 2px 8px #7209b733;
      transition: background 0.2s, transform 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover {
      background: #9d4edd;
      transform: scale(1.05);
      color: #fff;
      text-decoration: none;
    }
    h1, h2, h3 {
      color: #e0aaff;
      text-align: center;
      margin-bottom: 1.2em;
    }
    .question-card {
      background: rgba(255,255,255,0.10);
      border-radius: 18px;
      margin: 1.2em 0;
      padding: 1.2em 1em 1em 1em;
      box-shadow: 0 2px 16px #a259ff33;
      text-align: left;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      transition: box-shadow 0.2s;
    }
    .question-card:hover {
      box-shadow: 0 4px 32px #a259ff55;
    }
    .q {
      font-size: 1.12rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5em;
    }
    .a {
      margin-left: 1.2em;
      margin-bottom: 0.3em;
      font-size: 1.08rem;
      color: #e0aaff;
    }
    .desc {
      margin-left: 1.2em;
      margin-bottom: 0.3em;
      font-size: 1.02rem;
      color: #b8b8ff;
      font-style: italic;
    }
    @media (max-width: 900px) {
      .container { padding: 1.5em 1em; }
      .question-card { padding: 1em 0.7em; }
    }
    @media (max-width: 600px) {
      .container { padding: 0.7em 0.2em; }
      h1, h2, h3 { font-size: 1.2em; }
      .question-card { padding: 0.7em 0.2em; font-size: 0.98em; }
      .q { font-size: 1em; }
      .a { font-size: 0.97em; }
      .desc { font-size: 0.95em; }
      .back-btn { top: 10px; left: 10px; font-size: 1em; padding: 0.5em 1.2em; }
    }
    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>
  <div class="container">
    <a href="index.html" class="back-btn" style="position:static;display:inline-block;margin-bottom:1.2em;top:auto;left:auto;">&larr; Back</a>
    <h2>Additional Questions and Answers</h2>
    <div id="additional-questions-list"></div>
  </div>
  <script type="module">
    import { db, collection, getDocs, query, orderBy } from '../admin/firebase.js';
    const list = document.getElementById('additional-questions-list');
    async function loadAdditionalQuestions() {
      list.innerHTML = '<em>Loading...</em>';
      const q = query(collection(db, 'notifications', 'conservation-geography', 'admin-additional-questions'), orderBy('date', 'desc'));
      const snap = await getDocs(q);
      list.innerHTML = '';
      let i = 1;
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const item = document.createElement('div');
        item.className = 'question-card';
        item.innerHTML = `
          <div class='q'>${i++}. ${data.question}</div>
          ${data.answer ? `<div class='a'>Answer: ${data.answer}</div>` : ''}
          ${data.description ? `<div class='desc'>Description: ${data.description}</div>` : ''}
        `;
        list.appendChild(item);
      });
    }
    loadAdditionalQuestions();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script>
    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      background: { color: "transparent" },
      particles: {
        number: { value: 60, density: { enable: true, area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        move: { enable: true, speed: 1, direction: "none", outModes: "bounce" },
        links: { enable: true, distance: 100, color: "#ffffff", opacity: 0.2, width: 1 }
      },
      interactivity: {
        events: {
          onHover: { enable: true, mode: "repulse" },
          onClick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { quantity: 4 }
        }
      }
    });
  </script>
</body>
</html>
