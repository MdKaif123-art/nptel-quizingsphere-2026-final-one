<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuizingSphere - Learn Answers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    html, body {
      min-height: 100vh;
      height: 100%;
      background: linear-gradient(135deg, #3a0ca3, #0f0f0f);
      color: #fff;
      overflow-x: hidden !important;
      overflow-y: auto;
      font-family: 'Poppins', sans-serif;
      position: relative;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE 10+ */
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none !important;
    }
    .logo {
      font-size: 3rem;
      font-weight: 700;
      color: #c77dff;
      margin-top: 40px;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 0 0 20px #7209b7;
      letter-spacing: 2px;
    }
    .main-box {
      background: rgba(30,0,60,0.15);
      border-radius: 32px;
      box-shadow: 0 4px 32px #3a0ca355;
      padding: 2.5em 2em 2em 2em;
      margin: 0 auto 2em auto;
      max-width: 100vw;
      box-sizing: border-box;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .start-btn {
      background: linear-gradient(45deg, #7209b7, #560bad);
      color: #fff;
      border: none;
      border-radius: 18px;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 0.8em 2.5em;
      margin: 1.5em 0 2em 0;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px #7209b733;
    }
    .start-btn:hover {
      background: #9d4edd;
      transform: scale(1.05);
    }
    .dropdown-label {
      font-size: 1.2rem;
      margin-right: 0.7em;
      color: #e0aaff;
    }
    select {
      font-size: 1.1rem;
      padding: 0.5em 1.2em;
      border-radius: 10px;
      border: none;
      background: #7209b7;
      color: #fff;
      margin-bottom: 1.5em;
      margin-top: 0.5em;
      box-shadow: 0 2px 8px #7209b733;
      outline: none;
      transition: background 0.2s;
    }
    select:focus {
      background: #9d4edd;
    }
    .questions-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #e0aaff;
      margin: 1.2em 0 0.7em 0;
      text-align: center;
    }
    .question-block {
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      margin: 1.5em 0;
      padding: 1.5em 1.2em 1.2em 1.2em;
      box-shadow: 0 2px 16px #a259ff33;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .question-block .q {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.7em;
    }
    .question-block .a {
      margin-left: 1.2em;
      margin-bottom: 0.3em;
      font-size: 1.08rem;
      color: #e0aaff;
    }
    .question-block .correct {
      color: #00ffcc;
      font-weight: 700;
      margin-top: 0.7em;
      font-size: 1.1rem;
      display: block;
    }
    .nav-links {
      margin-top: 2em;
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      align-items: center;
    }
    .nav-links a {
      color: #e0aaff;
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #f15bb5;
    }
    @media (max-width: 600px) {
      .logo { font-size: 2rem; }
      .main-box { padding: 1.2em 0.5em; }
      .questions-title { font-size: 1.3rem; }
      .question-block { padding: 1em 0.5em; }
    }
    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>
  <div class="logo">QuizingSphere</div>
  <div class="main-box">
    <div id="week-select-section">
      <label class="dropdown-label" for="week-select">Select Week:</label>
      <select id="week-select" style="background:#a259ff; border:2px solid #fff; color:#fff; font-weight:700;">
        <option value="" disabled selected>Select Week</option>
        <option value="week1">Week 1</option>
        <option value="week2">Week 2</option>
        <option value="week3">Week 3</option>
        <option value="week4">Week 4</option>
        <option value="week5">Week 5</option>
        <option value="week6">Week 6</option>
        <option value="week7">Week 7</option>
        <option value="week8">Week 8</option>
        <option value="week9">Week 9</option>
        <option value="week10">Week 10</option>
        <option value="week11">Week 11</option>
        <option value="week12">Week 12</option>
      </select>
    </div>
    <div class="questions-title" id="questions-title" style="display:none;">Questions for Week</div>
    <div id="questions-list"></div>
    <div class="nav-links">
      <a href="index.html">Back to Homepage</a>
      <a href="practice.html">Go to Week Selection</a>
    </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script>
    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      background: { color: "transparent" },
    particles: {
        number: { value: 60, density: { enable: true, area: 800 } },
      color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        move: { enable: true, speed: 1, direction: "none", outModes: "bounce" },
        links: { enable: true, distance: 100, color: "#ffffff", opacity: 0.2, width: 1 }
    },
    interactivity: {
      events: {
          onHover: { enable: true, mode: "repulse" },
          onClick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { quantity: 4 }
        }
      }
    });
    document.getElementById('week-select').onchange = function() {
      const week = this.value;
      const questions = allQuestions[week] || [];
      const list = document.getElementById('questions-list');
      const title = document.getElementById('questions-title');
      list.innerHTML = '';
      if (questions.length) {
        title.style.display = '';
        title.textContent = `Questions for Week ${week.replace('week','')}`;
        questions.forEach((q, idx) => {
          const block = document.createElement('div');
          block.className = 'question-block';
          block.innerHTML = `<div class='q'>${idx+1}. ${q.question}</div>` +
            q.answers.map(a => `<div class='a'>${a}</div>`).join('') +
            `<span class='correct'>Correct Answer: ${q.correctAnswer}</span>`;
          list.appendChild(block);
        });
        } else {
        title.style.display = '';
        title.textContent = 'No questions found for this week.';
      }
    };
</script>
</body>
</html>
